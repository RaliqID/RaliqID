name: profile update

on:
  schedule:
    # Every 3 hours so the panels never sit stale for a full day. GitHub's
    # scheduler is best-effort; the push trigger below is the real-time path.
    - cron: '15 */3 * * *'
  push:
    branches: [main]
  # Lets the heartbeat repo (or any external caller) poke this on demand:
  #   gh api repos/kouji999/kouji999/dispatches -f event_type=refresh
  repository_dispatch:
    types: [refresh]
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two renders race each other onto the output branch.
concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch stats via GitHub GraphQL (own token)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const login = 'kouji999';
            const from = new Date(Date.now() - 365 * 864e5).toISOString();
            const q = `query($login:String!,$from:DateTime!){ user(login:$login){
              contributionsCollection(from:$from){ totalCommitContributions totalPullRequestContributions totalPullRequestReviewContributions totalIssueContributions totalRepositoryContributions contributionCalendar{ totalContributions weeks{ contributionDays{ date contributionCount }}}}
              repositories(first:100, privacy:PUBLIC, ownerAffiliations:OWNER, orderBy:{field:PUSHED_AT,direction:DESC}){ totalCount nodes{ name description isFork pushedAt primaryLanguage{ name } stargazerCount } }
            }}`;
            const data = await github.graphql(q, { login, from });
            const cc = data.user.contributionsCollection;
            const days = cc.contributionCalendar.weeks.flatMap(w => w.contributionDays);
            // Every public repo, no cap. Repos you own are what the profile
            // should show; there is no reason to truncate this list.
            const repos = data.user.repositories.nodes
              .filter(r => r.name !== login)
              .map(r => ({ name: r.name, desc: r.description || (r.isFork ? 'fork — kept in orbit' : 'undocumented world'), lang: r.primaryLanguage ? r.primaryLanguage.name : 'Other', stars: r.stargazerCount, pushedAt: r.pushedAt }));
            const stats = {
              total: cc.contributionCalendar.totalContributions,
              commits: cc.totalCommitContributions,
              prs: cc.totalPullRequestContributions,
              reviews: cc.totalPullRequestReviewContributions,
              issues: cc.totalIssueContributions,
              repoContribs: cc.totalRepositoryContributions,
              starsEarned: repos.reduce((a, r) => a + r.stars, 0),
              days, repos,
            };
            fs.writeFileSync('stats.json', JSON.stringify(stats));
            core.info(`stats.json: ${days.length} days, ${repos.length} repos, ${stats.total} contributions`);

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: render adventure + constellation
        run: |
          set -e
          # Fail loudly with context instead of a bare stack trace, so a future
          # breakage is diagnosable from the run log alone.
          if [ ! -f stats.json ]; then
            echo "::error::stats.json missing — the GraphQL step did not run"
            exit 1
          fi
          node -e "
            const s = require('./stats.json');
            const need = ['days','repos','total'];
            for (const k of need) if (s[k] === undefined) { console.error('missing stats key:', k); process.exit(1); }
            if (!s.days.length) { console.error('stats.days is empty'); process.exit(1); }
            console.log('stats ok:', s.days.length, 'days,', s.repos.length, 'repos,', s.total, 'contributions');
          "
          node scripts/render-stats.mjs
          for f in dist/adventure.svg dist/constellation.svg dist/constellation-more.md; do
            [ -s "$f" ] || { echo "::error::$f was not rendered"; exit 1; }
          done

      - name: render contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kouji999
          outputs: |
            dist/github-contribution-grid-snake.svg?color_background=0e1424&color_snake=23D3C3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_background=0d1117&color_snake=E8C877

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
