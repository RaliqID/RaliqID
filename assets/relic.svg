<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><title>Hidden Star Relic</title><desc>A rotating eight-point star relic that glows when hovered near the abyss.</desc><style><![CDATA[
@keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:1} }
.tw { animation: twinkle 3.4s ease-in-out infinite; }
.spin{animation:spin 14s linear infinite;transform-origin:48px 48px}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.3}50%{opacity:.9}}
]]></style>
<circle class="pulse" cx="48" cy="48" r="40" fill="#7fd8cf" opacity=".15"/>
<g class="spin"><path d="M48 8 53 35 48 30 43 35Z M48 88 53 61 48 66 43 61Z M8 48 35 43 30 48 35 53Z M88 48 61 43 66 48 61 53Z" fill="#e8c877"/>
<circle cx="48" cy="48" r="11" fill="#101828" stroke="#e8c877" stroke-width="2"/>
<circle class="tw" cx="48" cy="48" r="4" fill="#7fd8cf"/></g>
</svg>